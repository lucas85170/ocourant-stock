workflows:
  ios-workflow:
    name: O'Courant Stock iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Vérifier le projet Xcode
        script: |
          set -e
          test -d "OCourantStock.xcodeproj"
          test -f "OCourantStock.xcodeproj/project.pbxproj"
          test -f "OCourantStock/OCourantStockApp.swift"
          xcodebuild -list -project "OCourantStock.xcodeproj"
      - name: Compiler pour vérifier le code (simulateur iOS)
        script: |
          set -e
          xcodebuild \
            -project "OCourantStock.xcodeproj" \
            -scheme "OCourantStock" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/**
