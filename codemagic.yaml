workflows:
  ios-workflow:
    name: O'Courant Stock iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Lister les projets Xcode
        script: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"
      - name: Compiler l'application iOS
        script: |
          xcodebuild -list -project OCourantStock.xcodeproj
